<!DOCTYPE html>
<html>

<head>
    <title>Admin Login</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --green: #52b788;
            --green-hi: #74c69d;
            --green-pale: #95d5b2;
            --green-deep: #2d6a4f;
            --green-leaf: #1b4332;
            --green-dim: rgba(82, 183, 136, 0.10);
            --green-glow: rgba(82, 183, 136, 0.28);
            --green-border: rgba(82, 183, 136, 0.22);

            --bg: #060f09;
            --surface: #090f0b;

            --text: #e8f5ee;
            --text-2: #b7d9c4;
            --text-3: #6b9e7f;

            --border: rgba(82, 183, 136, 0.08);
            --border2: rgba(82, 183, 136, 0.18);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM Sans', sans-serif;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(27, 67, 50, 0.65) 0%, transparent 45%),
                radial-gradient(ellipse at 80% 100%, rgba(27, 67, 50, 0.5) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(82, 183, 136, 0.03) 0%, transparent 55%);
            pointer-events: none;
            z-index: 0;
            animation: ambBreath 9s ease-in-out infinite alternate;
        }

        @keyframes ambBreath {
            from {
                opacity: 0.7;
            }

            to {
                opacity: 1;
            }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(82, 183, 136, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(82, 183, 136, 0.025) 1px, transparent 1px);
            background-size: 44px 44px;
            pointer-events: none;
            z-index: 0;
        }

        /* Floating leaves */
        .leaves {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .leaf {
            position: absolute;
            opacity: 0;
            animation: leafFall linear infinite;
        }

        .leaf:nth-child(1) {
            left: 5%;
            width: 13px;
            animation-duration: 12s;
            animation-delay: 0s;
        }

        .leaf:nth-child(2) {
            left: 18%;
            width: 9px;
            animation-duration: 15s;
            animation-delay: 3s;
        }

        .leaf:nth-child(3) {
            left: 35%;
            width: 15px;
            animation-duration: 10s;
            animation-delay: 6s;
        }

        .leaf:nth-child(4) {
            left: 60%;
            width: 11px;
            animation-duration: 13s;
            animation-delay: 1s;
        }

        .leaf:nth-child(5) {
            left: 78%;
            width: 14px;
            animation-duration: 11s;
            animation-delay: 4s;
        }

        .leaf:nth-child(6) {
            left: 92%;
            width: 10px;
            animation-duration: 14s;
            animation-delay: 7s;
        }

        @keyframes leafFall {
            0% {
                opacity: 0;
                top: -4%;
                transform: translateX(0) rotate(0deg);
            }

            8% {
                opacity: 0.55;
            }

            92% {
                opacity: 0.35;
            }

            100% {
                opacity: 0;
                top: 104%;
                transform: translateX(52px) rotate(345deg);
            }
        }

        /* Fireflies */
        .ff {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #95d5b2;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            box-shadow: 0 0 5px #95d5b2, 0 0 10px rgba(149, 213, 178, 0.5);
            animation: ffFloat linear infinite;
        }

        .ff:nth-child(1) {
            top: 15%;
            left: 7%;
            animation-duration: 7s;
            animation-delay: 0s;
        }

        .ff:nth-child(2) {
            top: 55%;
            left: 75%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .ff:nth-child(3) {
            top: 35%;
            left: 20%;
            animation-duration: 6s;
            animation-delay: 4s;
        }

        .ff:nth-child(4) {
            top: 75%;
            left: 88%;
            animation-duration: 8s;
            animation-delay: 1s;
        }

        .ff:nth-child(5) {
            top: 25%;
            left: 92%;
            animation-duration: 11s;
            animation-delay: 5s;
        }

        @keyframes ffFloat {

            0%,
            100% {
                opacity: 0;
                transform: translate(0, 0);
            }

            20% {
                opacity: 1;
                transform: translate(13px, -15px);
            }

            50% {
                opacity: 0.6;
                transform: translate(-8px, -28px);
            }

            80% {
                opacity: 0.9;
                transform: translate(17px, -11px);
            }
        }

        /* Grass */
        .grass {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            pointer-events: none;
            z-index: 0;
        }

        /* Card */
        .form-box {
            position: relative;
            z-index: 2;
            background: rgba(9, 15, 11, 0.88);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            padding: 38px 34px 32px;
            border-radius: 22px;
            width: 400px;
            max-width: calc(100vw - 40px);
            border: 1px solid var(--green-border);
            box-shadow:
                0 0 0 1px rgba(82, 183, 136, 0.06),
                0 32px 72px rgba(0, 0, 0, 0.7),
                0 0 80px rgba(27, 67, 50, 0.35);
            animation: cardRise 0.65s cubic-bezier(0.34, 1.3, 0.64, 1) both;
        }

        @keyframes cardRise {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .form-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 18%;
            right: 18%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--green), transparent);
            border-radius: 2px;
        }

        .card-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 14px;
            background: var(--green-dim);
            border: 1.5px solid var(--green-border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 18px rgba(82, 183, 136, 0.18);
            animation: iconBreath 3.5s ease-in-out infinite;
        }

        @keyframes iconBreath {

            0%,
            100% {
                box-shadow: 0 0 18px rgba(82, 183, 136, 0.18);
            }

            50% {
                box-shadow: 0 0 30px rgba(82, 183, 136, 0.42);
            }
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            margin-bottom: 4px;
        }

        .card-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: var(--green-hi);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 24px;
            opacity: 0.8;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-3);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(82, 183, 136, 0.06);
            border: 1px solid var(--border2);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.12);
        }

        input::placeholder {
            color: var(--text-3);
            opacity: 0.5;
        }

        .error-msg {
            color: #e05252;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        button[type="submit"] {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--green-deep) 0%, var(--green) 100%);
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
            box-shadow: 0 4px 18px rgba(45, 106, 79, 0.45);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 26px rgba(82, 183, 136, 0.4);
        }

        button[type="submit"]:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <!-- Floating leaves -->
    <div class="leaves">
        <svg class="leaf" viewBox="0 0 20 28" fill="none">
            <path d="M10 2C10 2 2 8 2 16c0 5.5 3.6 9.5 8 9.5S18 21.5 18 16C18 8 10 2 10 2Z"
                fill="rgba(82,183,136,0.45)" />
            <line x1="10" y1="26" x2="10" y2="10" stroke="rgba(82,183,136,0.3)" stroke-width="1" />
        </svg>
        <svg class="leaf" viewBox="0 0 20 28" fill="none">
            <path d="M10 2C10 2 2 8 2 16c0 5.5 3.6 9.5 8 9.5S18 21.5 18 16C18 8 10 2 10 2Z"
                fill="rgba(116,198,157,0.35)" />
            <line x1="10" y1="26" x2="10" y2="10" stroke="rgba(116,198,157,0.25)" stroke-width="1" />
        </svg>
        <svg class="leaf" viewBox="0 0 20 28" fill="none">
            <path d="M10 2C10 2 2 8 2 16c0 5.5 3.6 9.5 8 9.5S18 21.5 18 16C18 8 10 2 10 2Z"
                fill="rgba(52,168,83,0.3)" />
            <line x1="10" y1="26" x2="10" y2="10" stroke="rgba(52,168,83,0.2)" stroke-width="1" />
        </svg>
        <svg class="leaf" viewBox="0 0 20 28" fill="none">
            <path d="M10 2C10 2 2 8 2 16c0 5.5 3.6 9.5 8 9.5S18 21.5 18 16C18 8 10 2 10 2Z"
                fill="rgba(82,183,136,0.4)" />
            <line x1="10" y1="26" x2="10" y2="10" stroke="rgba(82,183,136,0.25)" stroke-width="1" />
        </svg>
        <svg class="leaf" viewBox="0 0 20 28" fill="none">
            <path d="M10 2C10 2 2 8 2 16c0 5.5 3.6 9.5 8 9.5S18 21.5 18 16C18 8 10 2 10 2Z"
                fill="rgba(149,213,178,0.35)" />
            <line x1="10" y1="26" x2="10" y2="10" stroke="rgba(149,213,178,0.2)" stroke-width="1" />
        </svg>
        <svg class="leaf" viewBox="0 0 20 28" fill="none">
            <path d="M10 2C10 2 2 8 2 16c0 5.5 3.6 9.5 8 9.5S18 21.5 18 16C18 8 10 2 10 2Z"
                fill="rgba(82,183,136,0.28)" />
            <line x1="10" y1="26" x2="10" y2="10" stroke="rgba(82,183,136,0.18)" stroke-width="1" />
        </svg>
    </div>

    <!-- Fireflies -->
    <div class="ff"></div>
    <div class="ff"></div>
    <div class="ff"></div>
    <div class="ff"></div>
    <div class="ff"></div>

    <!-- Grass -->
    <svg class="grass" viewBox="0 0 1440 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path
            d="M0,60 Q25,30 50,52 Q75,74 100,45 Q125,16 150,50 Q175,84 200,55 Q225,26 250,56 Q275,86 300,58 Q325,30 350,56 Q375,82 400,52 Q425,22 450,55 Q475,88 500,60 Q525,32 550,58 Q575,84 600,55 Q625,26 650,58 Q675,90 700,60 Q725,30 750,56 Q775,82 800,55 Q825,28 850,58 Q875,88 900,60 Q925,32 950,56 Q975,80 1000,55 Q1025,30 1050,58 Q1075,86 1100,60 Q1125,34 1150,58 Q1175,82 1200,55 Q1225,28 1250,60 Q1275,92 1300,60 Q1325,28 1350,58 Q1375,88 1400,55 Q1420,70 1440,60 L1440,90 L0,90 Z"
            fill="rgba(27,67,50,0.5)" />
        <path
            d="M0,75 Q35,58 70,72 Q105,86 140,68 Q175,50 210,72 Q245,94 280,74 Q315,54 350,74 Q385,94 420,72 Q455,50 490,74 Q525,98 560,74 Q595,50 630,72 Q665,94 700,74 Q735,54 770,74 Q805,94 840,72 Q875,50 910,74 Q945,98 980,74 Q1015,50 1050,72 Q1085,94 1120,74 Q1155,54 1190,74 Q1225,94 1260,72 Q1295,50 1330,74 Q1365,98 1400,76 Q1420,84 1440,76 L1440,90 L0,90 Z"
            fill="rgba(9,15,11,0.96)" />
    </svg>

    <!-- Card -->
    <div class="form-box">

        <div class="card-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M12 2C12 2 5 7.5 5 14c0 4.5 3.1 7.5 7 7.5s7-3 7-7.5C19 7.5 12 2 12 2Z"
                    fill="rgba(82,183,136,0.2)" stroke="#52b788" stroke-width="1.4" />
                <path d="M12 22V12" stroke="#52b788" stroke-width="1.3" stroke-linecap="round" />
            </svg>
        </div>

        <h2>Admin Login</h2>
        <div class="card-sub">🌿 Forest Registry Access</div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username" />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password" />
        </div>

        <div class="error-msg" id="errorMsg">❌ Invalid username or password</div>

        <button type="submit" onclick="login()">Login</button>

    </div>

    <script>
        async function login() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!username || !password) {
                document.getElementById("errorMsg").style.display = "block";
                return;
            }

            try {
                const res = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success) {
                    window.location.href = "/userspage";
                } else {
                    document.getElementById("errorMsg").style.display = "block";
                }

            } catch (err) {
                document.getElementById("errorMsg").style.display = "block";
                console.log(err);
            }
        }

        document.addEventListener("keydown", e => {
            if (e.key === "Enter") login();
        });
    </script>
</body>

</html>
