<!DOCTYPE html>
<html>

<head>
  <title>Users</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --green:        #52b788;
      --green-hi:     #74c69d;
      --green-pale:   #95d5b2;
      --green-deep:   #2d6a4f;
      --green-leaf:   #1b4332;
      --green-dim:    rgba(82, 183, 136, 0.10);
      --green-glow:   rgba(82, 183, 136, 0.28);
      --green-border: rgba(82, 183, 136, 0.22);

      --bg:       #060f09;
      --surface:  #090f0b;
      --surface2: #0d1710;
      --surface3: #111f15;
      --surface4: #162418;

      --text:   #e8f5ee;
      --text-2: #b7d9c4;
      --text-3: #6b9e7f;
      --text-4: #345444;

      --border:  rgba(82,183,136,0.08);
      --border2: rgba(82,183,136,0.18);

      --red:    #e05252;
      --amber:  #d4a24a;
      --blue:   #4a90d9;
    }

    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      font-family: 'DM Sans', sans-serif;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ── Ambient forest background ───────────── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 15% 0%,   rgba(27,67,50,0.6)  0%, transparent 45%),
        radial-gradient(ellipse at 85% 100%, rgba(27,67,50,0.5)  0%, transparent 40%),
        radial-gradient(ellipse at 50% 50%,  rgba(82,183,136,0.03) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
      animation: ambBreath 9s ease-in-out infinite alternate;
    }
    @keyframes ambBreath {
      from { opacity: 0.7; }
      to   { opacity: 1; }
    }

    /* ── Grid texture ─────────────────────────── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(82,183,136,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(82,183,136,0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Floating leaves ─────────────────────── */
    .leaves {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .leaf {
      position: absolute; opacity: 0;
      animation: leafFall linear infinite;
    }
    .leaf:nth-child(1) { left: 4%;  width: 13px; animation-duration: 12s; animation-delay: 0s; }
    .leaf:nth-child(2) { left: 15%; width: 9px;  animation-duration: 15s; animation-delay: 3s; }
    .leaf:nth-child(3) { left: 30%; width: 15px; animation-duration: 10s; animation-delay: 6s; }
    .leaf:nth-child(4) { left: 55%; width: 11px; animation-duration: 13s; animation-delay: 1s; }
    .leaf:nth-child(5) { left: 72%; width: 14px; animation-duration: 11s; animation-delay: 4s; }
    .leaf:nth-child(6) { left: 88%; width: 10px; animation-duration: 14s; animation-delay: 7s; }
    .leaf:nth-child(7) { left: 96%; width: 12px; animation-duration: 9s;  animation-delay: 2s; }
    @keyframes leafFall {
      0%   { opacity: 0;   top: -4%;  transform: translateX(0)   rotate(0deg); }
      8%   { opacity: 0.55; }
      92%  { opacity: 0.35; }
      100% { opacity: 0;   top: 104%; transform: translateX(55px) rotate(350deg); }
    }

    /* ── Fireflies ───────────────────────────── */
    .ff {
      position: fixed; width: 3px; height: 3px;
      background: #95d5b2; border-radius: 50%;
      pointer-events: none; z-index: 0;
      box-shadow: 0 0 5px #95d5b2, 0 0 10px rgba(149,213,178,0.5);
      animation: ffFloat linear infinite;
    }
    .ff:nth-child(1) { top: 12%; left: 6%;  animation-duration: 7s;  animation-delay: 0s; }
    .ff:nth-child(2) { top: 50%; left: 72%; animation-duration: 9s;  animation-delay: 2s; }
    .ff:nth-child(3) { top: 30%; left: 22%; animation-duration: 6s;  animation-delay: 4s; }
    .ff:nth-child(4) { top: 72%; left: 90%; animation-duration: 8s;  animation-delay: 1s; }
    .ff:nth-child(5) { top: 22%; left: 94%; animation-duration: 11s; animation-delay: 5s; }
    .ff:nth-child(6) { top: 80%; left: 10%; animation-duration: 10s; animation-delay: 3s; }
    @keyframes ffFloat {
      0%,100% { opacity: 0;   transform: translate(0,0); }
      20%      { opacity: 1;   transform: translate(14px,-16px); }
      50%      { opacity: 0.6; transform: translate(-8px,-30px); }
      80%      { opacity: 0.9; transform: translate(18px,-12px); }
    }

    /* ── Grass silhouette ────────────────────── */
    .grass {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 100px; pointer-events: none; z-index: 0;
    }

    /* ── Main container ──────────────────────── */
    .container {
      position: relative; z-index: 2;
      background: rgba(9,15,11,0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 32px 30px;
      border-radius: 20px;
      width: 960px;
      max-width: 100%;
      border: 1px solid var(--green-border);
      box-shadow:
        0 0 0 1px rgba(82,183,136,0.06),
        0 30px 70px rgba(0,0,0,0.7),
        0 0 80px rgba(27,67,50,0.35);
      animation: cardRise 0.65s cubic-bezier(0.34,1.3,0.64,1) both;
    }
    @keyframes cardRise {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    /* Top green glow line */
    .container::before {
      content: '';
      position: absolute;
      top: 0; left: 15%; right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
      border-radius: 2px;
    }

    /* ── Header ──────────────────────────────── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border2);
      position: relative;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 42px; height: 42px;
      border: 1.5px solid var(--green-border);
      border-radius: 12px;
      background: var(--green-dim);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 16px rgba(82,183,136,0.18);
      animation: iconBreath 3.5s ease-in-out infinite;
    }
    @keyframes iconBreath {
      0%,100% { box-shadow: 0 0 16px rgba(82,183,136,0.18); }
      50%      { box-shadow: 0 0 28px rgba(82,183,136,0.4); }
    }

    .header-titles { display: flex; flex-direction: column; gap: 2px; }

    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.5px;
    }

    .header-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--green-hi);
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .add-btn {
      background: linear-gradient(135deg, var(--green-deep), var(--green));
      color: var(--text);
      padding: 10px 20px;
      border: 1.5px solid var(--green-border);
      border-radius: 10px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(45,106,79,0.4);
      position: relative; overflow: hidden;
    }
    .add-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--green), #95d5b2);
      opacity: 0; transition: opacity 0.2s;
    }
    .add-btn:hover::before { opacity: 1; }
    .add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(82,183,136,0.4);
    }
    .add-btn span { position: relative; z-index: 1; }

    /* ── Search box ──────────────────────────── */
    .search-box {
      text-align: center;
      margin-bottom: 20px;
    }

    .search-wrap {
      position: relative;
      display: inline-block;
    }
    .search-icon {
      position: absolute;
      left: 13px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search-box input {
      padding: 10px 16px 10px 38px;
      width: 300px;
      background: var(--surface2);
      border: 1.5px solid var(--border2);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      caret-color: var(--green);
    }
    .search-box input::placeholder {
      color: var(--text-4);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
    }
    .search-box input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(82,183,136,0.08), 0 0 16px rgba(82,183,136,0.06);
    }

    /* ── Status text ─────────────────────────── */
    .status {
      text-align: center;
      margin: 10px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 1px;
    }

    /* ── Table ───────────────────────────────── */
    .table-wrap {
      border: 1px solid var(--border2);
      border-radius: 14px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead { position: sticky; top: 0; z-index: 3; }

    th {
      background: var(--surface3);
      color: var(--green-hi);
      padding: 13px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--green-border);
      text-align: center;
    }
    th:first-child { text-align: left; padding-left: 20px; }

    td {
      padding: 12px 14px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-2);
      vertical-align: middle;
    }
    td:first-child { text-align: left; padding-left: 20px; color: var(--text); font-weight: 500; }
    td:last-child  { border-bottom: none; }

    tbody tr {
      transition: background 0.18s;
    }
    tbody tr:hover {
      background: rgba(82,183,136,0.05);
    }
    tbody tr:last-child td {
      border-bottom: none;
    }

    /* ── User image ──────────────────────────── */
    .user-img {
      width: 44px; height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--green-border);
      box-shadow: 0 0 10px rgba(82,183,136,0.2);
    }

    /* ── Action buttons ──────────────────────── */
    .btn-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    button {
      padding: 6px 13px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: #fff;
      transition: all 0.18s ease;
      position: relative;
      overflow: hidden;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.15); }
    button:active { transform: scale(0.95); }

    .edit-btn {
      background: linear-gradient(135deg, #1a6e35, #28a745);
      border: 1px solid rgba(40,167,69,0.4);
      box-shadow: 0 2px 10px rgba(40,167,69,0.25);
    }
    .delete-btn {
      background: linear-gradient(135deg, #8b1a1a, #c0392b);
      border: 1px solid rgba(192,57,43,0.4);
      box-shadow: 0 2px 10px rgba(192,57,43,0.25);
    }
    .cert-btn {
      background: linear-gradient(135deg, var(--green-deep), var(--green));
      border: 1px solid var(--green-border);
      box-shadow: 0 2px 10px rgba(82,183,136,0.25);
    }

    /* ── Email monospace ─────────────────────── */
    .email-cell {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 0.3px;
    }

    /* ── Scrollbar ───────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--green);
      border-radius: 4px;
      box-shadow: 0 0 6px var(--green);
    }
  </style>

</head>

<body>

  <!-- Floating leaves -->
  <div class="leaves">
    <svg class="leaf" viewBox="0 0 20 28" fill="none"><path d="M10 2C10 2 2 8 2 16c0 5.5 3.6 9.5 8 9.5S18 21.5 18 16C18 8 10 2 10 2Z" fill="rgba(82,183,136,0.45)"/><line x1="10" y1="26" x2="10" y2="10" stroke="rgba(82,183,136,0.3)" stroke-width="1"/></svg>
    <svg class="leaf" viewBox="0 0 20 28" fill="none"><path d="M10 2C10 2 2 8 2 16c0 5.5 3.6 9.5 8 9.5S18 21.5 18 16C18 8 10 2 10 2Z" fill="rgba(116,198,157,0.35)"/><line x1="10" y1="26" x2="10" y2="10" stroke="rgba(116,198,157,0.25)" stroke-width="1"/></svg>
    <svg class="leaf" viewBox="0 0 20 28" fill="none"><path d="M10 2C10 2 2 8 2 16c0 5.5 3.6 9.5 8 9.5S18 21.5 18 16C18 8 10 2 10 2Z" fill="rgba(52,168,83,0.3)"/><line x1="10" y1="26" x2="10" y2="10" stroke="rgba(52,168,83,0.2)" stroke-width="1"/></svg>
    <svg class="leaf" viewBox="0 0 20 28" fill="none"><path d="M10 2C10 2 2 8 2 16c0 5.5 3.6 9.5 8 9.5S18 21.5 18 16C18 8 10 2 10 2Z" fill="rgba(82,183,136,0.4)"/><line x1="10" y1="26" x2="10" y2="10" stroke="rgba(82,183,136,0.25)" stroke-width="1"/></svg>
    <svg class="leaf" viewBox="0 0 20 28" fill="none"><path d="M10 2C10 2 2 8 2 16c0 5.5 3.6 9.5 8 9.5S18 21.5 18 16C18 8 10 2 10 2Z" fill="rgba(149,213,178,0.35)"/><line x1="10" y1="26" x2="10" y2="10" stroke="rgba(149,213,178,0.2)" stroke-width="1"/></svg>
    <svg class="leaf" viewBox="0 0 20 28" fill="none"><path d="M10 2C10 2 2 8 2 16c0 5.5 3.6 9.5 8 9.5S18 21.5 18 16C18 8 10 2 10 2Z" fill="rgba(82,183,136,0.28)"/><line x1="10" y1="26" x2="10" y2="10" stroke="rgba(82,183,136,0.18)" stroke-width="1"/></svg>
    <svg class="leaf" viewBox="0 0 20 28" fill="none"><path d="M10 2C10 2 2 8 2 16c0 5.5 3.6 9.5 8 9.5S18 21.5 18 16C18 8 10 2 10 2Z" fill="rgba(116,198,157,0.4)"/><line x1="10" y1="26" x2="10" y2="10" stroke="rgba(116,198,157,0.28)" stroke-width="1"/></svg>
  </div>

  <!-- Fireflies -->
  <div class="ff"></div>
  <div class="ff"></div>
  <div class="ff"></div>
  <div class="ff"></div>
  <div class="ff"></div>
  <div class="ff"></div>

  <!-- Grass -->
  <svg class="grass" viewBox="0 0 1440 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,65 Q25,35 50,58 Q75,82 100,50 Q125,18 150,55 Q175,92 200,60 Q225,28 250,62 Q275,96 300,65 Q325,34 350,62 Q375,90 400,58 Q425,26 450,60 Q475,94 500,65 Q525,36 550,62 Q575,88 600,60 Q625,32 650,65 Q675,98 700,65 Q725,32 750,62 Q775,92 800,60 Q825,28 850,62 Q875,96 900,65 Q925,34 950,62 Q975,90 1000,60 Q1025,30 1050,62 Q1075,94 1100,65 Q1125,36 1150,62 Q1175,88 1200,60 Q1225,32 1250,65 Q1275,98 1300,65 Q1325,32 1350,62 Q1375,92 1400,60 Q1425,28 1440,65 L1440,100 L0,100 Z" fill="rgba(27,67,50,0.5)"/>
    <path d="M0,80 Q35,60 70,76 Q105,92 140,72 Q175,52 210,76 Q245,100 280,78 Q315,56 350,78 Q385,100 420,76 Q455,52 490,78 Q525,104 560,78 Q595,52 630,76 Q665,100 700,78 Q735,56 770,78 Q805,100 840,76 Q875,52 910,78 Q945,104 980,78 Q1015,52 1050,76 Q1085,100 1120,78 Q1155,56 1190,78 Q1225,100 1260,76 Q1295,52 1330,78 Q1365,104 1400,80 Q1420,88 1440,80 L1440,100 L0,100 Z" fill="rgba(9,15,11,0.95)"/>
  </svg>

  <!-- ══ CONTAINER ══ -->
  <div class="container">

    <div class="header">
      <div class="header-left">
        <div class="header-icon">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <path d="M11 2C11 2 4 7 4 14c0 4.5 3.1 7.5 7 7.5s7-3 7-7.5C18 7 11 2 11 2Z" fill="rgba(82,183,136,0.2)" stroke="#52b788" stroke-width="1.3"/>
            <path d="M11 21V11" stroke="#52b788" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M11 15 Q14 12 17 13" stroke="#74c69d" stroke-width="1" stroke-linecap="round" opacity=".6"/>
            <path d="M11 18 Q8 15 5 16"  stroke="#74c69d" stroke-width="1" stroke-linecap="round" opacity=".6"/>
          </svg>
        </div>
        <div class="header-titles">
          <h2>Stored Users</h2>
          <div class="header-sub">🌿 Forest Registry</div>
        </div>
      </div>
      <a href="/"><button class="add-btn"><span>+ Add User</span></button></a>
    </div>

    <div class="search-box">
      <div class="search-wrap">
        <div class="search-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="6" cy="6" r="4" stroke="rgba(82,183,136,0.5)" stroke-width="1.3"/>
            <path d="M9.5 9.5l3 3" stroke="rgba(82,183,136,0.5)" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </div>
        <input type="text" id="searchInput" placeholder="// search forest..." onkeyup="searchUser()">
      </div>
    </div>

    <div class="status" id="statusText">Loading...</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Number</th>
            <th>Image</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="userTable"></tbody>
      </table>
    </div>

  </div>

  <!-- ══════════════ ORIGINAL SCRIPT — ZERO CHANGES ══════════════ -->
  <script>

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, function (m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[m];
      });
    }

    function loadUsers(search = "") {

      document.getElementById("statusText").innerText = "Loading...";

      fetch("/users?search=" + encodeURIComponent(search))
        .then(res => res.json())
        .then(data => {

          let table = document.getElementById("userTable");
          table.innerHTML = "";

          if (data.length === 0) {
            document.getElementById("statusText").innerText = "No users found";
            return;
          }

          document.getElementById("statusText").innerText = "";

          data.forEach(user => {

            let row = `
<tr>
<td>${escapeHTML(user.name)}</td>
<td class="email-cell">${escapeHTML(user.email)}</td>
<td>${user.age}</td>
<td>${user.number || ""}</td>

<td>
${user.image ? `<img src="${user.image}" class="user-img">` : ""}
</td>

<td>
<div class="btn-wrap">
<a href="/editpage?id=${user._id}">
<button class="edit-btn">Edit</button>
</a>

<button class="delete-btn" onclick="deleteUser('${user._id}')">
Delete
</button>

<button class="cert-btn" onclick="openCertificate('${user._id}')">
Certificate
</button>
</div>
</td>
</tr>
`;

            table.innerHTML += row;

          });

        })
        .catch(() => {
          document.getElementById("statusText").innerText = "Error loading users ❌";
        });

    }

    loadUsers();

    function searchUser() {
      let search = document.getElementById("searchInput").value;
      loadUsers(search);
    }

    function deleteUser(id) {

      if (confirm("Delete this user?")) {

        fetch("/delete/" + id, { method: "DELETE" })
          .then(() => loadUsers())
          .catch(() => alert("Error deleting user"));

      }

    }

    function openCertificate(id) {
      window.location.href = "/certificate?id=" + id;
    }

  </script>
  <!-- ══════════════ END ORIGINAL SCRIPT ══════════════ -->

</body>
</html>
